name: Vérification Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier la syntaxe
        run: python -m compileall .

      - name: Vérifier les dépendances
        run: python -m pip check

      - name: Exécuter les tests disponibles
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pip install pytest
            python -m pytest
          else
            echo "Aucun test Python trouvé pour le moment."
          fi
