name: Vérification Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-app-test.txt

      - name: Installer les dépendances
        # requirements-app-test inclut requirements-app ; le verrou ML historique
        # contient des versions différentes et appartient à un environnement séparé.
        run: python -m pip install -r requirements-app-test.txt

      - name: Télécharger les données
        run: python scripts/download_data.py

      - name: Vérifier la syntaxe
        run: python -m compileall .

      - name: Vérifier les dépendances
        run: python -m pip check

      - name: Exécuter tous les tests
        run: python -m pytest
