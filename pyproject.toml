[project]
name = "sise-enedis-ml-study"
version = "0.1.0"
description = "Préparation et modélisation des données DPE ADEME"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
    "ipywidgets>=8.1.7",
    "joblib==1.5.2",
    "matplotlib==3.11.2",
    "mlflow>=3.5,<4",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.18.1",
    "requests==2.34.2",
    "scikit-learn==1.7.2",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
# Dépendances antérieures conservées, hors du périmètre ML courant.
app = [
    "plotly>=7.1.0",
    "pydeck>=0.9.3",
    "streamlit>=1.66.1",
    "streamlit-dynamic-filters>=0.1.9",
]
experiments = [
    "datetime>=5.5",
    "ipynb>=0.5.1",
    "xgboost>=3.1.1",
]
